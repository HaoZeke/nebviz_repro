[workspace]
authors = ["Rohit Goswami <rohit.goswami@epfl.ch>"]
channels = ["conda-forge", "https://repo.prefix.dev/rg-forge", "metatensor", "bioconda"]
name = "nebviz"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.dag]
args = ["_cwd"]
cmd = "cd {{ _cwd }} && snakemake -F --dag | dot -Tsvg > resources/dag.svg"

[tasks.rulegraph]
args = ["_cwd"]
cmd = "cd {{ _cwd }} && snakemake -F --rulegraph | dot -Tsvg > resources/rulegraph.svg"

[tasks.filegraph]
args = ["_cwd"]
cmd = "cd {{ _cwd }} && snakemake -F --filegraph | dot -Tsvg > resources/filegraph.svg"

[tasks.graphs]
args = ["_cwd"]
depends-on = [
  { task = "dag", args = ["{{ _cwd }}"] },
  { task = "rulegraph", args = ["{{ _cwd }}"] },
  { task = "filegraph", args = ["{{ _cwd }}"] },
]

[tasks.all-graphs]
depends-on = [
  { task = "graphs", args = ["oxad"] },
]

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]

[dependencies]
ira = ">=2.2.0,<3"
eon = ">=2.9.0,<3"
libtorch = ">=2.9.1,<3"
snakemake = ">=9.16.3,<10"

[pypi-dependencies]
rgpycrumbs = ">=0.1.2, <0.2"
ase = ">=3.27.0, <4"
requests = "*"
metatrain = ">=2026.1, <2027"

[feature.cuda.pypi-options]
extra-index-urls = []

[feature.cuda.dependencies]
cuda-toolkit = ">=13.1.1,<14"
cuda-compiler = ">=13.1.1,<14"
cuda-libraries-dev = ">=13.1.1,<14"
cuda-version = ">=13.1,<14"
cuda-nvcc = ">=13.1.115,<14"
cuda-cudart-dev = ">=13.1.80,<14"
cuda-driver-dev = ">=13.1.80,<14"
pytorch = ">=2.9.1,<3"

[environments]
cuda = {features = ["cuda"]}
