[workspace]
authors = ["Rohit Goswami <rohit.goswami@epfl.ch>"]
channels = ["conda-forge", "https://repo.prefix.dev/rg-forge", "metatensor", "bioconda"]
name = "nebviz"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.dag]
args = ["_cwd"]
cmd = "cd {{ _cwd }} && snakemake --configfile config/general_config.yml -F --dag | dot -Tsvg > resources/dag.svg"

[tasks.rulegraph]
args = ["_cwd"]
cmd = "cd {{ _cwd }} && snakemake --configfile config/general_config.yml -F --rulegraph | dot -Tsvg > resources/rulegraph.svg"

[tasks.filegraph]
args = ["_cwd"]
cmd = "cd {{ _cwd }} && snakemake --configfile config/general_config.yml -F --filegraph | dot -Tsvg > resources/filegraph.svg"

[tasks.all]
cmd = "cd eonRuns && snakemake --configfile config/general_config.yml -c4"

[tasks.figures]
cmd = "cd eonRuns && snakemake --configfile config/general_config.yml -c4 all_figures"

[tasks.dry-run]
cmd = "cd eonRuns && snakemake --configfile config/general_config.yml -n -p"

[tasks.graphs]
args = ["_cwd"]
depends-on = [
  { task = "dag", args = ["{{ _cwd }}"] },
  { task = "rulegraph", args = ["{{ _cwd }}"] },
  { task = "filegraph", args = ["{{ _cwd }}"] },
]

[tasks.all-graphs]
depends-on = [
  { task = "graphs", args = ["eonRuns"] },
]

[dependencies]
ira = ">=2.2.0,<3"
snakemake = ">=9.16.3,<10"
python = ">=3.11,<3.14"
numpy = ">=2.3,<3"
matplotlib = ">=3.10,<4"
ase = ">=3.27.0,<4"
requests = ">=2.28,<3"

[pypi-dependencies]
rgpycrumbs = ">=1.6.1,<2"
chemparseplot = ">=1.6.1,<2"
readcon = ">=0.8.0,<0.9"

[feature.cpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]
index-strategy = "unsafe-best-match"

[feature.cpu.dependencies]
libtorch = ">=2.9.1,<3"
eon = ">=2.12.0,<3"

[feature.cpu.pypi-dependencies]
metatrain = { git = "https://github.com/metatensor/metatrain", rev = "492f0bfaeb3ea72fda4252b0dd6c055363cf199a" }

[environments]
cpu = {features = ["cpu"]}
