compute_target: cpu
common:
  number_of_intermediate_imgs: 10
systems:
  # ethylene + n2o
  # birkholz -> 01_c2no2
  system_100:
    reactant: resources/ewNEB/configurations/system100-react.xyz
    product: resources/ewNEB/configurations/system100-prod.xyz
    saddle: resources/ewNEB/configurations/system100-sp.xyz
  11_grignard:
    reactant: resources/icFSM/birkholz/11_grignard/initial/ipath_000.con
    product: resources/icFSM/birkholz/11_grignard/initial/ipath_001.con
    saddle: resources/icFSM/birkholz/11_grignard/ts.xyz
    optimizer:
      converged_force: 0.6
  bicyclobutane_05:
    reactant: resources/mlFSM/05_bicyclobutane/initial/ipath_000.con
    product: resources/mlFSM/05_bicyclobutane/initial/ipath_001.con
    saddle: resources/mlFSM/05_bicyclobutane/ts.xyz
paths:
  models: "results/00_models"
  endpoints: "results/01_endpoints"
  neb: "results/02_neb"
  figures: "results/03_figures"
  cache: "results/_cache"
plotting:
  blog_system: system_100
  blog_prefix: neb-viz
  surface_type_small: grad_imq
  surface_type_large: grad_imq_ny
  ira_kmax: 14
  dpi: 300
  # Width matters; profile height is set by the content-sized strip layout.
  figsize_profile: "6.4 5.5"
  figsize_landscape: "5.37 5.37"
  fontsize_base: 12
  zoom_ratio: 0.35
  facecolor: white
  rotation: "15x,55y,0z"
  perspective_tilt: 8
  strip_renderer: xyzrender
  cmap_landscape: viridis
  plot_structures: crit_points
eon:
  config: "resources/config.ini"
upet:
  model: "pet-omat-l-v1.0.0"
